min_version = "2026.7.16"

[tasks.all]
description = "Install/link packages"
depends = [
    "dotfiles",
    "gh-extensions",
    "vim-update",
    "mise:packages",
    "bat-cache",
    "skills",
    "codex:config",
    "zed:config",
    "herdr-plugins",
]
depends_post = ["brew"]

[tasks.submodules]
description = "Initialize git submodules"
run = "git submodule update --init --recursive"

[tasks."mise:packages"]
description = "Install global mise packages"
depends = ["dotfiles"]
run = "cd $HOME && mise install"

[tasks.herdr-plugins]
description = "Link local Herdr plugins"
depends = ["dotfiles"]
run = '''
for plugin in "$HOME"/.config/herdr/plugins/*; do
  [ -f "$plugin/herdr-plugin.toml" ] || continue
  herdr plugin link "$plugin" --enabled
done
'''

[tasks.dotfiles]
description = "Install dotfiles"
depends = ["submodules"]
run = "mise bootstrap dotfiles apply"

[dotfiles]
