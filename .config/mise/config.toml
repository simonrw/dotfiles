[tools]
go = "latest"
rust = { version = "stable", components = "rust-src,rust-analyzer" }
"pipx:ipython" = "latest"
python = "latest"
"go:github.com/simonrw/cert-info" = "0"
"github:jj-vcs/jj" = { version = "latest", os = ["linux"] }
"github:tmux/tmux-builds" = { version = "latest", os = ["linux"] }
fzf = { version = "latest", os = ["linux"] }
node = { version = "lts", os = ["linux"] }
"github:sachaos/viddy" = { version = "latest", os = ["linux"] }
"github:sharkdp/bat" = { version = "latest", os = ["linux"] }
"github:sharkdp/hyperfine" = { version = "latest", os = ["linux"] }
"github:bootandy/dust" = { version = "latest", os = ["linux"] }
"github:max-sixty/worktrunk" = { version = "latest", os = ["linux"] }
"cargo:iroh-ssh" = "latest"
bun = { version = "latest", os = ["linux"] }
usage = { version = "latest", os = ["linux"] }
"github:lima-vm/lima" = { version = "latest", os = ["linux"] }
jless = { version = "latest", os = ["linux"] }
gh = { version = "latest", os = ["linux"] }
uv = { version = "latest", os = ["linux"] }
jjui = { version = "latest", os = ["linux"] }
lazygit = { version = "latest", os = ["linux"] }
"github:tummychow/git-absorb" = { version = "latest", os = ["linux"] }
television = { version = "latest", os = ["linux"] }
mkcert = { version = "latest", os = ["linux"] }
tree-sitter = { version = "latest", os = ["linux"] }
tokei = { version = "latest", os = ["linux"] }
"npm:@fission-ai/openspec" = "latest"
duckdb = { version = "latest", os = ["linux"] }
helix = { version = "latest", os = ["linux"] }
watchexec = { version = "latest", os = ["linux"] }
xh = { version = "latest", os = ["linux"] }
atuin = { version = "latest", os = ["linux"] }
"github:simonrw/shell-agent" = "latest"
"github:agavra/tuicr" = "latest"
"github:tjarvstrand/dojjo" = "latest"

[tools."github:simonrw/listprojects"]
version = "latest"

[tools."github:simonrw/listprojects".platforms]
macos-arm64 = { asset_pattern = "*-aarch64-apple-darwin*" }

[tools."github:MordechaiHadad/bob"]
version = "latest"
os = ["linux"]

[tools."github:MordechaiHadad/bob".platforms]
linux-x64 = { asset_pattern = "bob-linux-x86_64.zip" }
macos-arm64 = { asset_pattern = "bob-macos-arm.zip" }

[settings]
experimental = true
# support .python-version files in Python
# required for LocalStack
idiomatic_version_file_enable_tools = ["python", "rust"]
minimum_release_age = "0s"

[settings.github]
credential_command = "gh auth token"
