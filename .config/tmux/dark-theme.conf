set -g @sidebar_color_agent_claude "#f5a97f"
set -g @sidebar_color_agent_codex "#c6a0f6"
set -g @sidebar_color_agent_opencode "#91d7e3"
set -g @sidebar_color_text_active "#cad3f5"
set -g @sidebar_color_text_muted "#a5adcb"
