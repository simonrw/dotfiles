post-remove = "worktrunk-session-hook post-remove '{{ repo_path }}' '{{ repo }}' '{{ branch | sanitize }}'"
pre-start = "worktrunk-session-hook pre-start '{{ repo_path }}' '{{ repo }}' '{{ branch | sanitize }}' '{{ worktree_path }}'"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

