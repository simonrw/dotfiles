post-remove = "worktrunk-session-hook post-remove '{{ repo_path }}' '{{ repo }}' '{{ branch | sanitize }}'"
pre-start = "worktrunk-session-hook pre-start '{{ repo_path }}' '{{ repo }}' '{{ branch | sanitize }}' '{{ worktree_path }}'"
worktree-path = "{{ repo_path }}/../{{ repo }}-{{ branch | sanitize }}"

[commit.generation]
command = "codex exec -m gpt-5.6-luna -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"


