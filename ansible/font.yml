---
- name: Create Monaspace font directory
  become: true
  ansible.builtin.file:
    path: /usr/share/fonts/monaspace
    state: directory
    mode: "0755"

- name: "Download Monaspace {{ item.archive }} fonts"
  ansible.builtin.get_url:
    url: "https://github.com/githubnext/monaspace/releases/download/v{{ monaspace_version }}/monaspace-{{ item.archive }}-v{{ monaspace_version }}.zip"
    dest: "/tmp/monaspace-{{ item.archive }}-v{{ monaspace_version }}.zip"
  loop: &monaspace_archives
    # static serves GUI apps, nerdfonts adds the icons terminals need
    - { archive: static, directory: "Static Fonts" }
    - { archive: nerdfonts, directory: NerdFonts }

- name: "Install Monaspace {{ item.archive }} fonts"
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/monaspace-{{ item.archive }}-v{{ monaspace_version }}.zip"
    dest: /usr/share/fonts/monaspace
    creates: "/usr/share/fonts/monaspace/{{ item.directory }}"
  loop: *monaspace_archives

- name: Refresh font cache
  become: true
  ansible.builtin.command: fc-cache -f
  changed_when: false
