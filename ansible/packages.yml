---
apt_keys: []

apt_repositories: []

common_packages:
  - build-essential
  - clang-18
  - cmake
  - curl
  - exuberant-ctags
  - eza
  - fd-find
  - ffmpeg
  - git-delta
  - git-lfs
  - htop
  - libcfitsio-dev
  - libclang-18-dev
  - liblua5.4-dev
  - libnss3-tools         # mkcert
  - libssl-dev
  - lua5.4
  - mosh
  - ncdu
  - podman
  - ripgrep
  - socat                 # for claude sandboxing
  - sqlite3
  - tmux
  - zsh

desktop_packages:
  - emacs
  - gnome-tweaks
  - wmctrl

headless_packages:
  - emacs-nox

font_packages:
  - fonts-jetbrains-mono

virtualization_packages:
  - bridge-utils
  - cpu-checker
  - libvirt-clients
  - libvirt-daemon
  - qemu-system

packages: >-
  {{
    common_packages
    + (desktop_packages if desktop_enabled | bool else headless_packages)
    + (font_packages if fonts_enabled | bool else [])
    + (virtualization_packages if virtualization_enabled | bool else [])
    + (['virt-manager'] if virtualization_enabled | bool and desktop_enabled | bool else [])
    + (['1password-cli'] if onepassword_cli_enabled | bool else [])
    + (['1password'] if onepassword_gui_enabled | bool else [])
    + (['python3-psutil'] if dconf_enabled | bool else [])
    + (['ethtool'] if wakeonlan_enabled | bool else [])
    + (['x11vnc'] if x11vnc_enabled | bool else [])
    + (['unattended-upgrades'] if unattended_upgrades_enabled | bool else [])
  }}

snaps:
  - slack
  - steam

classic_snaps:
  - pycharm
