[tools]
node = "lts"
"npm:@jmfederico/pi-web" = "latest"

[bootstrap.macos.launchd.agents.pi-web-sessiond]
program = "~/.local/share/mise/shims/pi-web-sessiond"
working_directory = "~/dotfiles"
environment = { MISE_ENABLE_TOOLS = "node,npm:@jmfederico/pi-web" }
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/pi-web-sessiond.log"
stderr_path = "~/Library/Logs/pi-web-sessiond.log"

[bootstrap.macos.launchd.agents.pi-web-server]
program = "~/.local/share/mise/shims/pi-web-server"
working_directory = "~/dotfiles"
environment = { MISE_ENABLE_TOOLS = "node,npm:@jmfederico/pi-web", PI_WEB_HOST = "0.0.0.0" }
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/pi-web-server.log"
stderr_path = "~/Library/Logs/pi-web-server.log"

[dotfiles]
"~/.config/karabiner/karabiner.json" = { source = ".config/karabiner/karabiner.json", mode = "symlink" }
"~/.hammerspoon" = { source = ".hammerspoon", mode = "symlink" }
"~/.pi/agent/extensions/mac-system-theme.ts" = { source = ".pi/agent/extensions/mac-system-theme.ts", mode = "symlink" }
"~/Library/Application Support/claude-session-monitor" = { source = "Library/Application Support/claude-session-monitor", mode = "symlink" }
"~/Library/Application Support/Code/User/keybindings.json" = { source = "Library/Application Support/Code/User/keybindings.json", mode = "symlink" }
"~/Library/Application Support/Code/User/settings.json" = { source = "Library/Application Support/Code/User/settings.json", mode = "symlink" }
"~/Library/Application Support/Cursor/User/keybindings.json" = { source = "Library/Application Support/Cursor/User/keybindings.json", mode = "symlink" }
"~/Library/Application Support/Cursor/User/settings.json" = { source = "Library/Application Support/Cursor/User/settings.json", mode = "symlink" }
"~/Library/Application Support/Firefox" = { source = "Library/Application Support/Firefox", mode = "symlink" }
"~/Library/Preferences/sapling" = { source = "Library/Preferences/sapling", mode = "symlink" }
